[pytest]
# Pytest configuration for OCR Pipeline V2.5.3
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (>1s)
    detector: Detector tests
    v253: Tests for V2.5.3 features (habilitacao_herdeiros, doenca_grave, obito)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
